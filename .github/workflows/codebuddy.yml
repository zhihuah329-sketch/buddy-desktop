name: CodeBuddy bridge checks
on:
  push:
    paths: ['packages/server/**', 'packages/core/**', 'tools/verify-codebuddy-*.mjs', 'tools/verify-streaming.mjs', 'pnpm-lock.yaml', '.github/workflows/codebuddy.yml']
  pull_request:
    paths: ['packages/server/**', 'packages/core/**', 'tools/verify-codebuddy-*.mjs', 'tools/verify-streaming.mjs', 'pnpm-lock.yaml', '.github/workflows/codebuddy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm run verify:codebuddy
